name: Feature request
description: Suggest an improvement or new capability for TaskBay
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like TaskBay to do?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Why does this help your workflow?
